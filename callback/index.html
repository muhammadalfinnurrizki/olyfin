<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olyfin login</title><link rel="stylesheet" href="../style.css"><script src="../config.js?v=1795306058"></script></head><body>
<header><img src="../logo.png" alt=""><h1>Olyfin</h1></header><p id="m">Connecting your TikTok account…</p>
<script>
(async () => {
  const p = new URLSearchParams(location.search), m = document.getElementById("m");
  if (p.get("error")) { m.textContent = "Login cancelled: " + (p.get("error_description") || p.get("error")); return }
  try {
    const r = await fetch(window.OLYFIN_API + "/api/exchange", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: p.get("code"), state: p.get("state")})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    try { localStorage.setItem("olyfin_sid", j.sid) } catch (e) {}
    location.replace("../app/");
  } catch (e) { m.innerHTML = "Login failed: " + e.message + ' · <a href="../app/">Try again</a>' }
})();
</script></body></html>
